# Publishes the site to GitHub Pages on every push to main and stamps the deploy date into:
#   • sitemap.xml  → <lastmod>
#   • index.html   → "dateModified" in the JSON-LD block
# so those dates never need to be updated by hand.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp last-modified dates
        run: |
          DATE=$(date -u +%F)
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>${DATE}</lastmod>|" sitemap.xml
          sed -i -E "s|\"dateModified\": \"[^\"]*\"|\"dateModified\": \"${DATE}\"|" index.html
          grep -q "<lastmod>${DATE}</lastmod>" sitemap.xml
          grep -q "\"dateModified\": \"${DATE}\"" index.html
          echo "Stamped ${DATE}"

      - name: Remove repo-only files from the published site
        run: rm -rf .github .claude README.md fonts/OFL.txt

      - name: Minify CSS, JS and HTML
        run: |
          npx --yes esbuild style.css --minify --outfile=style.css --allow-overwrite
          npx --yes esbuild main.js --minify --outfile=main.js --allow-overwrite
          npx --yes html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o index.html index.html
          # Fail the deploy if minification damaged the JSON-LD or the stamped date.
          python3 - <<'PY'
          import json, re
          html = open("index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          assert len(blocks) == 2, f"expected 2 JSON-LD blocks, found {len(blocks)}"
          for b in blocks:
              json.loads(b)
          assert '"dateModified"' in html
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
