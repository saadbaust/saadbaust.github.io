# Publishes the site to GitHub Pages on every push to main (including saves
# from Pages CMS) and stamps the deploy date into:
#   • sitemap.xml  → <lastmod>
#   • index.html   → "dateModified" in the JSON-LD block
# so those dates never need to be updated by hand.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp last-modified dates
        run: |
          DATE=$(date -u +%F)
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>${DATE}</lastmod>|" sitemap.xml
          sed -i -E "s|\"dateModified\": \"[^\"]*\"|\"dateModified\": \"${DATE}\"|" index.html
          grep -q "<lastmod>${DATE}</lastmod>" sitemap.xml
          grep -q "\"dateModified\": \"${DATE}\"" index.html
          echo "Stamped ${DATE}"

      - name: Validate CMS data files
        run: |
          python3 -m json.tool data.json > /dev/null
          python3 -m json.tool content.json > /dev/null

      - name: Remove repo-only files from the published site
        run: rm -rf .github .pages.yml README.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
