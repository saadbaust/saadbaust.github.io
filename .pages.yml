media:
  - name: events-images
    label: "Event Photos"
    input: images/events
    output: /images/events
    categories: [image]
    rename: false

  - name: memories-images
    label: "Memory Photos"
    input: images/memories
    output: /images/memories
    categories: [image]
    rename: false

content:
  # ── Publications ──────────────────────────────────────────────────────
  # One single raw-text/code editor for the WHOLE publications.bib file.
  # No per-paper forms, no separate "Item #1, #2..." entries — just paste
  # your entire multi-entry .bib export here in one go and Save, exactly
  # like opening the .bib file in a text editor.
  - name: publications
    label: "Publications"
    type: file
    path: publications.bib
    format: code

# No "Gallery" content entry on purpose: photos are managed entirely
# through Media → Event Photos / Memory Photos below. Upload a file there
# and it appears on the site automatically — gallery.html lists whatever
# is actually in images/events/ and images/memories/ at runtime and turns
# each filename into its caption/alt text. No extra data file to edit.
