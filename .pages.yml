# ═══════════════════════════════════════════════════════════════════════════
# PAGES CMS CONFIGURATION
# Website: https://pagescms.org
# CMS Dashboard: https://app.pagescms.org/saadbaust/saadbaust.github.io
#
# This config defines what content is editable via the Pages CMS interface.
# Everything else is hard-coded in index.html and NOT editable here.
#
# CMS-Managed Content:
#   1. Publications (BibTeX file) — your complete .bib file
#   2. Stats — Citations, h-index, i10-index counts
#   3. Teaching Courses — rows in the "Teaching Duties" table
#
# Workflow: Edit in CMS → auto-commits to GitHub → live site updates in ~60 sec
# Technical: Site fetches publications.bib and data.json in the browser at load time.
# ═══════════════════════════════════════════════════════════════════════════

content:
  # ═══════════════════════════════════════════════════════════════════════════
  # PUBLICATIONS (BibTeX FILE)
  # The entire publications.bib file in a single code editor.
  # The site parses this in the browser: splits entries, categorizes (journal/conf),
  # and auto-counts total papers. No manual "Total Pubs" field needed.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: publications
    label: "Publications (BibTeX)"
    type: file
    path: publications.bib
    format: code
    description: >-
      Paste your COMPLETE BibTeX here — the entire contents of your .bib file
      exactly as if opened in a text editor. All entries must start with @
      (e.g., @article{...} for journals, @INPROCEEDINGS{...} for conferences).
      The site auto-sorts and counts papers.
      How to add: Google Scholar or IEEE Xplore → Cite button → BibTeX → copy & paste.
      How to remove: Delete the entire entry block (from @ to closing }).

  # ═══════════════════════════════════════════════════════════════════════════
  # STATS & TEACHING COURSES (data.json)
  # Two independent data sets in one file:
  # 1. Stats: Citations, h-index, i10-index (displayed on Publications section)
  # 2. Teaching: Course list populating the "Teaching Duties" table
  # Note: "Total Pubs" is auto-counted from BibTeX, not stored here.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: data
    label: "Stats & Teaching Courses"
    type: file
    path: data.json
    description: "Research citation stats and the Teaching Duties course table."
    fields:
      # Research metrics from Google Scholar
      - name: stats
        label: "Google Scholar Stats"
        type: object
        fields:
          - { name: citations, label: "Citations",     type: number, description: "Total citation count across all papers" }
          - { name: hIndex,    label: "h-index",       type: number, description: "h-index metric (papers with h+ citations)" }
          - { name: i10Index,  label: "i10-index",     type: number, description: "Number of papers with 10+ citations" }

      # Teaching duties table: add, remove, reorder courses
      - name: courses
        label: "Teaching Courses"
        type: object
        list: true
        description: "Each row = one course in the Teaching Duties table. Drag rows to reorder. Use + to add, trash to remove."
        fields:
          - { name: code,      label: "Course Code",      type: string, description: "E.g., CSE 2101" }
          - { name: title,     label: "Course Title",     type: string, description: "E.g., Digital Logic Design" }
          - { name: semesters, label: "Semesters Taught", type: string, description: "E.g., Summer 2024, Winter 2025" }
