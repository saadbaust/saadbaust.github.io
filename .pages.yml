# ───────────────────────────────────────────────────────────────────────────
# Pages CMS configuration  —  https://pagescms.org
#
# This single file decides what you can edit when you log into the CMS at
#   https://app.pagescms.org/saadbaust/saadbaust.github.io
#
# Everything else on the site is now hard-coded directly in index.html and is
# NOT editable here. Three things are CMS-managed:
#   1. Publications     → your full BibTeX (paste the whole .bib in one box)
#   2. Stats            → Citations, h-index, i10-index (Total Pubs auto-counted)
#   3. Teaching Courses → the rows of the "Teaching Duties" table
#
# Save in the CMS → it commits to GitHub → the live site updates within a
# minute. The site reads publications.bib and data.json in the browser.
# ───────────────────────────────────────────────────────────────────────────

content:
  # ── Publications (BibTeX) ───────────────────────────────────────────────
  # The whole publications.bib file in one editor. The site reads this file
  # directly, splits it into entries, separates journals vs. conferences, and
  # counts the total as the "Total Pubs" number on the page.
  - name: publications
    label: "Publications (BibTeX)"
    type: file
    path: publications.bib
    format: code
    description: >-
      Paste your COMPLETE BibTeX here — the entire contents of your .bib file,
      all entries together in one go, exactly like opening the .bib file in a
      text editor. Each entry must start with @ (for example @article{...} for
      journals or @INPROCEEDINGS{...} for conferences). The site sorts journals
      and conferences for you and counts the total automatically.
      Tip: on Google Scholar or IEEE Xplore, click Cite → BibTeX to copy an
      entry, then paste it in below. To remove a paper, delete its block.

  # ── Stats & Teaching Courses ────────────────────────────────────────────
  # Both live in data.json. "Total Pubs" is counted automatically from the
  # BibTeX, so it isn't here. The Teaching Courses list below populates the
  # "Teaching Duties" table on the page — add, remove, or reorder rows.
  - name: data
    label: "Stats & Teaching Courses"
    type: file
    path: data.json
    description: "Citation/h-index stats and the Teaching Duties course table."
    fields:
      - name: stats
        label: "Google Scholar Stats"
        type: object
        fields:
          - { name: citations, label: "Citations", type: number }
          - { name: hIndex,    label: "h-index",   type: number }
          - { name: i10Index,  label: "i10-index", type: number }
      - name: courses
        label: "Teaching Courses"
        type: object
        list: true
        description: "Each entry is one row of the Teaching Duties table. Drag to reorder; use the + and trash icons to add or remove courses."
        fields:
          - { name: code,      label: "Course Code",      type: string }
          - { name: title,     label: "Course Title",     type: string }
          - { name: semesters, label: "Semesters Taught", type: string }
