media:
  - name: events-images
    label: "Event Photos"
    input: images/events
    output: /images/events
    categories: [image]
    rename: false

  - name: memories-images
    label: "Memory Photos"
    input: images/memories
    output: /images/memories
    categories: [image]
    rename: false

content:
  # ── Publications ──────────────────────────────────────────────────────
  # Edits data/publications.json. The site already knows how to parse a raw
  # BibTeX string into a paper card (title/author/venue/year/DOI), so the
  # only field we need per entry is the BibTeX text itself — paste it
  # straight from Google Scholar's or IEEE Xplore's "Cite" button, exactly
  # like before, just through a UI instead of a text editor + git push.
  - name: publications
    label: "Publications"
    type: file
    path: data/publications.json
    fields:
      - name: entries
        label: "Papers"
        type: object
        list:
          collapsible:
            summary: "{fields.bibtex}"
        fields:
          - name: bibtex
            label: "BibTeX entry"
            type: text
            description: >
              Paste the FULL BibTeX citation, including the @article{...} or
              @INPROCEEDINGS{...} wrapper line. Copy this directly from
              Google Scholar ("Cite" → BibTeX) or IEEE Xplore ("Cite this" →
              BibTeX). The site auto-detects journal vs. conference from the
              @article / @INPROCEEDINGS tag and sorts by the year= field.

  # ── Gallery ───────────────────────────────────────────────────────────
  # Edits data/gallery.json. Two photo lists — Events and Memories — each
  # rendered into gallery.html at runtime. Uploading an image here drops the
  # file straight into images/events/ or images/memories/ in the repo.
  - name: gallery
    label: "Gallery"
    type: file
    path: data/gallery.json
    fields:
      - name: events
        label: "Events"
        type: object
        list:
          collapsible:
            summary: "{fields.caption}"
        fields:
          - name: image
            label: "Photo"
            type: image
            options:
              media: events-images
          - name: alt
            label: "Alt text"
            type: string
            description: "Describes the photo for screen readers and SEO."
          - name: caption
            label: "Caption"
            type: string
            description: "Shown under the photo and in the lightbox."

      - name: memories
        label: "Memories"
        type: object
        list:
          collapsible:
            summary: "{fields.caption}"
        fields:
          - name: image
            label: "Photo"
            type: image
            options:
              media: memories-images
          - name: alt
            label: "Alt text"
            type: string
            description: "Describes the photo for screen readers and SEO."
          - name: caption
            label: "Caption"
            type: string
            description: "Shown under the photo and in the lightbox."
