# ═══════════════════════════════════════════════════════════════════════════
# PAGES CMS CONFIGURATION
# Website: https://pagescms.org
# CMS Dashboard: https://app.pagescms.org/saadbaust/saadbaust.github.io
#
# This config defines what content is editable via the Pages CMS interface.
# Everything else is hard-coded in index.html and NOT editable here.
#
# The CMS has THREE screens (one per file):
#
#   A. Publications (BibTeX)  → publications.bib
#        journals, conferences, preprints (@misc) AND datasets (@dataset)
#
#   B. Profile, Experience & Research  → data.json   (top half of the page)
#        1. Profile Card — subtitle, institution, objective line
#        2. About — intro paragraph + research-focus tags
#        3. Experience — the Experience timeline entries
#        4. Education — degrees / certificates with results
#        5. Research Projects — funded/collaborative project list
#        6. Thesis — thesis / M.Sc. research entries
#
#   C. Activities, Teaching & Extras  → content.json  (lower half of the page)
#        7.  Research Activities — review experience + undergrad thesis co-supervisions
#        8.  Teaching Courses — rows in the "Teaching Duties" table
#        9.  Leadership & Co-curricular Activities — bulleted list
#        10. Projects — software / web development projects
#        11. Awards & Achievements — bulleted list
#
# Workflow: Edit in CMS → auto-commits to GitHub → live site updates in ~60 sec
# Technical: Site fetches publications.bib, data.json and content.json in the
# browser at load time.
# ═══════════════════════════════════════════════════════════════════════════

content:
  # ═══════════════════════════════════════════════════════════════════════════
  # PUBLICATIONS (BibTeX FILE)
  # The entire publications.bib file in a single code editor.
  # The site parses this in the browser and splits entries into
  # journals / conferences / preprints / datasets.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: publications
    label: "Publications (BibTeX)"
    type: file
    path: publications.bib
    format: code
    description: >-
      Paste your COMPLETE BibTeX here — the entire contents of your .bib file
      exactly as if opened in a text editor. All entries must start with @
      (e.g., @article{...} for journals, @INPROCEEDINGS{...} for conferences,
      @misc{...} for preprints, @dataset{...} for datasets). Preprints are
      @misc entries carrying eprint / archivePrefix / primaryClass fields — an
      arXiv BibTeX entry already has these, so paste it unchanged. Datasets use
      the @dataset type (older @misc dataset entries still work too). The site
      auto-sorts entries by year within each group.
      How to add: Google Scholar / IEEE Xplore / arXiv / Kaggle → Cite → BibTeX → copy & paste.
      How to remove: Delete the entire entry block (from @ to closing }).

  # ═══════════════════════════════════════════════════════════════════════════
  # PROFILE, EXPERIENCE & RESEARCH (data.json)
  # The top half of the page: identity + the core academic / professional record.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: data
    label: "Profile, Experience & Research"
    type: file
    path: data.json
    description: "Profile card, About, Stats, Experience, Education, Research Projects, and Thesis."
    fields:
      # ── Profile rail (name card on the left) ────────────────────────────────
      - name: profile
        label: "Profile Card"
        type: object
        description: "The text under your photo in the left profile card."
        fields:
          - { name: subtitle,    label: "Subtitle / Role", type: string, description: "E.g., Lecturer, Department of CSE" }
          - { name: institution, label: "Institution",     type: string }
          - { name: target,      label: "Objective Line",  type: string, description: "E.g., Seeking MSc/PhD positions for Fall 2027" }

      # ── About section ───────────────────────────────────────────────────────
      - name: about
        label: "About"
        type: object
        description: "The intro paragraph and research-focus tags in the About section."
        fields:
          - { name: paragraph, label: "Intro Paragraph", type: text }
          - { name: interests, label: "Core Research Focus", type: string, list: true, description: "Short interest tags, one per line" }

      # ── Experience timeline ─────────────────────────────────────────────────
      - name: experience
        label: "Experience"
        type: object
        list: true
        description: "Each entry = one position in the Experience timeline. Drag to reorder."
        fields:
          - { name: title,    label: "Job Title",    type: string, description: "E.g., Lecturer" }
          - { name: org,      label: "Organization", type: string, description: "Department / institution" }
          - { name: location, label: "Location",     type: string, description: "E.g., On Site — Nilphamari (optional)" }
          - { name: duration, label: "Duration",     type: string, description: "E.g., July 2024 – Present" }
          - { name: bullets,  label: "Bullet Points", type: string, list: true, description: "One line per responsibility / achievement" }

      # ── Education timeline ──────────────────────────────────────────────────
      - name: education
        label: "Education"
        type: object
        list: true
        description: "Each entry = one degree / certificate, newest first. Drag to reorder."
        fields:
          - { name: degree,   label: "Degree / Certificate", type: string, description: "E.g., B.Sc. Engineering in CSE" }
          - { name: school,   label: "Institution",          type: string }
          - { name: duration, label: "Duration",             type: string, description: "E.g., July 2020 – July 2024" }
          - { name: grade,    label: "Result / Grade",       type: string, description: "E.g., CGPA: 3.96 / 4.00 (Ranked 1st)" }

      # ── Research projects ───────────────────────────────────────────────────
      - name: researchProjects
        label: "Research Projects"
        type: object
        list: true
        description: "Funded / collaborative research projects. Drag to reorder."
        fields:
          - { name: title,    label: "Project Title", type: string }
          - { name: meta,     label: "Details",       type: string, description: "E.g., Role: Contributor · Funded by BAC" }
          - { name: duration, label: "Duration",      type: string, description: "E.g., 2025–2026" }
          - { name: status,   label: "Status Badge",  type: string, description: "E.g., Ongoing, Completed (optional)" }

      # ── Thesis / M.Sc. research ─────────────────────────────────────────────
      - name: thesis
        label: "Thesis"
        type: object
        list: true
        description: "Thesis and major research works. Drag to reorder."
        fields:
          - { name: title,       label: "Title",       type: string }
          - { name: duration,    label: "Duration",    type: string, description: "E.g., 2026–Present" }
          - { name: description, label: "Description", type: text }

  # ═══════════════════════════════════════════════════════════════════════════
  # ACTIVITIES, TEACHING & EXTRAS (content.json)
  # The lower half of the page: research activities, teaching, and the
  # secondary sections. Kept in a separate file so neither screen is too long.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: content
    label: "Activities, Teaching & Extras"
    type: file
    path: content.json
    description: "Research Activities, Teaching Courses, Leadership, Projects, and Awards."
    fields:
      # ── Research Activities: Review experience ──────────────────────────────
      - name: reviewExperience
        label: "Review Experience"
        type: string
        list: true
        description: "Peer-review / reviewer roles. One entry per line."

      # ── Research Activities: Co-supervisions (ongoing) ──────────────────────
      - name: coSupervisionsOngoing
        label: "Thesis Co-Supervisions — Ongoing"
        type: object
        list: true
        description: "Ongoing undergraduate thesis groups you co-supervise."
        fields:
          - { name: title,     label: "Thesis Topic", type: string }
          - { name: timeframe, label: "Timeframe",    type: string, description: "E.g., October 2024 – Ongoing" }

      # ── Research Activities: Co-supervisions (completed) ────────────────────
      - name: coSupervisionsCompleted
        label: "Thesis Co-Supervisions — Completed"
        type: string
        list: true
        description: "Completed co-supervised works, as full citations. One per line."

      # ── Teaching duties table ───────────────────────────────────────────────
      - name: courses
        label: "Teaching Courses"
        type: object
        list: true
        description: "Each row = one course in the Teaching Duties table. Drag to reorder."
        fields:
          - { name: code,      label: "Course Code",      type: string, description: "E.g., CSE 2101" }
          - { name: title,     label: "Course Title",     type: string, description: "E.g., Digital Logic Design" }
          - { name: semesters, label: "Semesters Taught", type: string, description: "E.g., Summer 2024, Winter 2025" }

      # ── Leadership & Co-curricular Activities ───────────────────────────────
      - name: leadership
        label: "Leadership & Co-curricular Activities"
        type: string
        list: true
        description: "Bulleted list. One activity per line."

      # ── Software / web development projects ─────────────────────────────────
      - name: devProjects
        label: "Projects (Software / Web)"
        type: object
        list: true
        description: "Development projects. Drag to reorder."
        fields:
          - { name: name,        label: "Project Name", type: string }
          - { name: description, label: "Description",  type: text }
          - { name: tools,       label: "Tools",        type: string, description: "E.g., WordPress, HTML, CSS" }

      # ── Awards & Achievements ───────────────────────────────────────────────
      - name: awards
        label: "Awards & Achievements"
        type: string
        list: true
        description: "Bulleted list. One award per line."
