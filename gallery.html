    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lb-close" aria-label="Close Image Viewer"><i class="fas fa-times"></i></button>
      <button class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Previous Image"><i class="fas fa-chevron-left"></i></button>
      <img class="lightbox-img" id="lb-img" src="" alt="Expanded gallery photo" />
      <span class="lightbox-counter" id="lb-counter"></span>
      <button class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next Image"><i class="fas fa-chevron-right"></i></button>
    </div>

    <button id="back-to-top" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <i class="fas fa-arrow-up"></i>
    </button>

    <script>
      const lightbox   = document.getElementById("lightbox");
      const lbImg      = document.getElementById("lb-img");
      const lbCounter  = document.getElementById("lb-counter");
      const lbClose    = document.getElementById("lb-close");
      const lbPrev     = document.getElementById("lb-prev");
      const lbNext     = document.getElementById("lb-next");

      const items = document.querySelectorAll(".masonry-item");
      const loadedSrcs = Array.from(items).map(item => item.querySelector("img").src);
      let currentIdx = 0;

      items.forEach((item, index) => {
        item.addEventListener("click", () => {
          currentIdx = index;
          updateLightbox();
          lightbox.classList.add("open");
          document.body.style.overflow = "hidden";
        });
      });

      function closeLightbox() {
        lightbox.classList.remove("open");
        document.body.style.overflow = "";
      }

      function updateLightbox() {
        lbImg.src = loadedSrcs[currentIdx];
        lbCounter.textContent = `${currentIdx + 1} / ${loadedSrcs.length}`;
      }

      function prevPhoto() {
        currentIdx = (currentIdx - 1 + loadedSrcs.length) % loadedSrcs.length;
        updateLightbox();
      }

      function nextPhoto() {
        currentIdx = (currentIdx + 1) % loadedSrcs.length;
        updateLightbox();
      }

      lbClose.addEventListener("click", closeLightbox);
      lbPrev.addEventListener("click", prevPhoto);
      lbNext.addEventListener("click", nextPhoto);

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "ArrowLeft")  prevPhoto();
        if (e.key === "ArrowRight") nextPhoto();
        if (e.key === "Escape")     closeLightbox();
      });

      const backToTop = document.getElementById("back-to-top");
      window.addEventListener("scroll", () => {
        backToTop.classList.toggle("visible", window.scrollY > 300);
      });
    </script>
