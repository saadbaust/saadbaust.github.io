        <!-- Both grids below are populated at runtime, primarily from
             images/gallery-manifest.json (generated by a GitHub Action whenever
             images/events/ or images/memories/ change — see
             .github/workflows/gallery-manifest.yml). If that manifest is ever
             missing or unreadable, the page falls back to asking the GitHub API
             directly, same as before. Upload or delete a photo through Pages CMS
             -> Media; the Action regenerates the manifest within ~1 minute and it
             appears or disappears here automatically. The caption/alt text is
             generated from the filename, so name your file the way you want it
             captioned, e.g. "Sajek Valley.webp" or "sajek-valley.webp" both show
             as "Sajek Valley". -->

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">

      <p class="lightbox-caption" id="lb-caption"></p>
      <span class="lightbox-counter" id="lb-counter"></span>
      <button class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
    </div>

    <button id="back-to-top" aria-label="Scroll back to top">
      <i class="fas fa-arrow-up"></i>

    <script>
    // ─── Config ────────────────────────────────────────────────────────────────
    const REPO_OWNER  = 'saadbaust';
    const REPO_NAME    = 'saadbaust.github.io';
    const REPO_BRANCH  = 'main';
    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

    // ─── Filename → caption/alt text ────────────────────────────────────────────
    // "sajek-valley.webp"          -> "Sajek Valley"
    // "World-Robotics-Olympiad-BD" -> "World Robotics Olympiad BD"  (acronyms kept)
    function humanizeFilename(filename) {
      const base = filename.replace(/\.[^/.]+$/, '');
      const words = base.replace(/[-_]+/g, ' ').trim().split(/\s+/);
      const cased = words.map(w => {
        if (w.length > 1 && w === w.toUpperCase()) return w;
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      });
      return cased.join(' ');
    }
    // Escape any value before it goes into markup (filenames are user-controlled).
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ─── PRIMARY SOURCE: static manifest, generated by a GitHub Action ─────────
    async function loadGalleryManifest() {
      try {
        const res = await fetch('images/gallery-manifest.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const manifest = await res.json();
        if (!Array.isArray(manifest.events) || !Array.isArray(manifest.memories)) {
          throw new Error('Manifest missing events/memories arrays');
        }
        return manifest;
      } catch (e) {
        console.warn('Could not load images/gallery-manifest.json, will fall back to GitHub API:', e);
        return null;
      }
    }

    // Manifest entries are plain relative paths, e.g. "images/events/photo.webp"
    function manifestPathsToItems(paths) {
      return paths.map(p => {
        const filename = p.split('/').pop();
        const caption  = humanizeFilename(filename);
        return { image: p, alt: caption, caption };
      });
    }

    // ─── FALLBACK ONLY: ask GitHub what's in a folder right now ────────────────
    async function fetchFolderImages(folderPath) {
      try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folderPath}?ref=${REPO_BRANCH}`;
        const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const files = await res.json();
        return files
          .filter(f => f.type === 'file' && IMAGE_EXTENSIONS.includes((f.name.split('.').pop() || '').toLowerCase()))
          .sort((a, b) => a.name.localeCompare(b.name))
          .map(f => {
            const caption = humanizeFilename(f.name);
            return { image: f.download_url, alt: caption, caption };
          });
      } catch (e) {
        console.error(`Could not list ${folderPath}:`, e);
        return null;
      }
    }

    function renderSection(gridId, countId, items) {
      const grid  = document.getElementById(gridId);
      const count = document.getElementById(countId);

      if (items === null) {
        count.textContent = '–';
        grid.innerHTML = '<p style="color:var(--gray);font-size:0.85rem;padding:8px 0;">Couldn\u2019t load photos right now — please refresh in a minute.</p>';
        return;
      }

      count.textContent = items.length;
      items.forEach(item => {
        grid.insertAdjacentHTML('beforeend', `
          <figure class="masonry-item">
            <div class="masonry-thumb"><img src="${esc(item.image)}" alt="${esc(item.alt)}" loading="lazy" /></div>
            <figcaption class="masonry-caption">${esc(item.caption)}</figcaption>
          </figure>`);
      });
    }

    // ─── Lightbox (unchanged behavior, just built from rendered items) ──
    function initLightbox() {
      const lightbox  = document.getElementById('lightbox');
      const lbImg     = document.getElementById('lb-img');
      const lbCaption = document.getElementById('lb-caption');
      const lbCounter = document.getElementById('lb-counter');

      const items = document.querySelectorAll('.masonry-item');
      const srcs  = Array.from(items).map(item => ({
        src:     item.querySelector('img').src,
        alt:     item.querySelector('img').alt,
        caption: item.querySelector('.masonry-caption')?.textContent.trim() || ''
      }));
      let current = 0;

      function updateLightbox() {
        lbImg.src             = srcs[current].src;
        lbImg.alt             = srcs[current].alt;
        lbCaption.textContent = srcs[current].caption;
        lbCounter.textContent = `${current + 1} / ${srcs.length}`;
      }

      function openLightbox(idx) {
        current = idx;
        updateLightbox();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      function prevPhoto() { current = (current - 1 + srcs.length) % srcs.length; updateLightbox(); }
      function nextPhoto() { current = (current + 1)               % srcs.length; updateLightbox(); }

      items.forEach((item, i) => item.addEventListener('click', () => openLightbox(i)));

      document.getElementById('lb-close').addEventListener('click', closeLightbox);
      document.getElementById('lb-prev').addEventListener('click', prevPhoto);
      document.getElementById('lb-next').addEventListener('click', nextPhoto);

      lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

      document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'ArrowLeft')  prevPhoto();
        if (e.key === 'ArrowRight') nextPhoto();
        if (e.key === 'Escape')     closeLightbox();
      });
    }

    function initBackToTop() {
      const btn = document.getElementById('back-to-top');
      btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      window.addEventListener('scroll', () => {
        btn.classList.toggle('visible', window.scrollY > 300);
      }, { passive: true });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const manifest = await loadGalleryManifest();

      let events, memories;
      if (manifest) {
        events   = manifestPathsToItems(manifest.events);
        memories = manifestPathsToItems(manifest.memories);
      } else {
        [events, memories] = await Promise.all([
          fetchFolderImages('images/events'),
          fetchFolderImages('images/memories'),
        ]);
      }

      renderSection('events-grid',   'events-count',   events);
      renderSection('memories-grid', 'memories-count', memories);
      initLightbox();      // must run AFTER the grids are populated
      initBackToTop();
    });
    </script>
